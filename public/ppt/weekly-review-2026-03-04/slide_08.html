<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta content="width=1280, initial-scale=1.0" name="viewport" />
    <title>本周研究趋势总结</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.13/dist/index.global.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        .slide-container {
            background-color: #000000;
            color: #ffffff;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center">
    <div class="slide-container w-[1280px] h-[720px] overflow-hidden relative aspect-[16/9] flex flex-col">
        <!-- Decorative Element: Circle Ring (Bottom Right) -->
        <div class="absolute bottom-[-80px] right-[-80px] z-10">
            <div class="w-[280px] h-[280px] rounded-full border-[3px] border-[#1C3D7A] opacity-40"></div>
        </div>
        
        <!-- Decorative Element: Circle Ring (Bottom Right Inner) -->
        <div class="absolute bottom-[-40px] right-[-40px] z-10">
            <div class="w-[200px] h-[200px] rounded-full border-[2px] border-[#0404AC] opacity-30"></div>
        </div>

        <div class="relative z-10 flex flex-col w-full h-full p-[30px]">
            <!-- Header -->
            <header class="flex justify-between items-center mb-8">
                <p class="text-sm font-medium tracking-wider font-sans">TREND SUMMARY</p>
                <p id="header" class="text-sm font-medium tracking-wider font-sans">2026年3月第1周</p>
            </header>

            <!-- Main Content -->
            <main class="flex-1 flex items-center">
                <div class="max-w-6xl w-full">
                    <!-- Title -->
                    <h1 class="font-serif font-normal mb-8 text-[44px] leading-[1.2] tracking-wide">
                        本周机器人领域三大核心趋势
                    </h1>
                    
                    <!-- Decorative Element: Accent Line (Blue) -->
                    <div class="w-[140px] h-[3px] bg-[#0404AC] mb-8"></div>
                    
                    <!-- Trend Points -->
                    <div class="grid grid-cols-1 gap-6">
                        <!-- Trend 1 -->
                        <div class="flex items-start gap-4">
                            <span class="text-[32px] font-bold text-[#002FA7] flex-shrink-0">01</span>
                            <div>
                                <h3 class="text-[26px] font-serif mb-2">人形机器人技术进入爆发期</h3>
                                <p class="text-gray-300 text-[18px]">零样本动作迁移、通用运动追踪等技术突破，大幅降低人形机器人的训练和部署成本，商业化落地进程将加速。</p>
                            </div>
                        </div>
                        
                        <!-- Trend 2 -->
                        <div class="flex items-start gap-4">
                            <span class="text-[32px] font-bold text-[#002FA7] flex-shrink-0">02</span>
                            <div>
                                <h3 class="text-[26px] font-serif mb-2">技术普惠与社会价值导向凸显</h3>
                                <p class="text-gray-300 text-[18px]">辅助机器人低维控制技术的成熟，让重度运动障碍群体也能享受到机器人技术带来的便利，机器人技术的社会价值得到越来越多关注。</p>
                            </div>
                        </div>
                        
                        <!-- Trend 3 -->
                        <div class="flex items-start gap-4">
                            <span class="text-[32px] font-bold text-[#002FA7] flex-shrink-0">03</span>
                            <div>
                                <h3 class="text-[26px] font-serif mb-2">工业/自动驾驶场景落地加速</h3>
                                <p class="text-gray-300 text-[18px]">仿真到现实迁移、多模态传感器融合等技术的突破，直接解决了工业机器人和自动驾驶量产落地的卡脖子问题，商业化应用将迎来爆发。</p>
                            </div>
                        </div>
                    </div>
                </div>
            </main>

            <!-- Footer -->
            <footer class="flex flex-col justify-between items-end mt-6 text-right">
                <!-- Presentation Title -->
                <p class="text-[#D1D5DB] text-sm font-medium mb-1 font-sans">本周机器人研发回顾</p>
                <!-- Caption -->
                <p class="text-xs font-normal text-[#D1D5DB] font-sans">2026-03-04</p>
            </footer>
        </div>

    </div>

</body>
</html>
