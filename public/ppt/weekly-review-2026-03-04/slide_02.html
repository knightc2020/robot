<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本周研究概览</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Georgia:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.13/dist/index.global.min.js"></script>
</head>
<body class="min-h-screen flex items-center justify-center">
    <div class="slide-container w-[1280px] h-[720px] overflow-hidden relative aspect-[16/9] flex flex-col bg-white text-gray-600">
        <div class="relative z-10 flex flex-col w-full h-full p-[30px]">
            <!-- Header -->
            <header class="flex justify-between items-center pb-2 mb-8 border-b border-black">
                <div class="font-sans text-lg font-semibold text-gray-900 uppercase">
                    OVERVIEW
                </div>
                <div id="header" class="font-sans text-sm font-semibold text-gray-900">
                    本周研究概览
                </div>
            </header>
            
            <!-- Main Content -->
            <main class="flex-1 flex flex-col justify-center">
                <div class="flex gap-12">
                    <!-- Left Column -->
                    <div class="w-[428px] flex-shrink-0 pt-6">
                        <!-- Title -->
                        <h1 class="font-serif text-[40px] font-normal text-gray-900 mb-6 leading-[1.2]">
                            本周研究概览
                        </h1>
                        <!-- Description -->
                        <div class="font-sans text-[22px] font-normal leading-[1.4]">
                            <p class="mb-4">本周共收录 <strong class="text-[#002FA7]">12篇</strong> 机器人领域顶会/arxiv最新论文，覆盖人形机器人、辅助机器人、工业机器人、自动驾驶四大核心方向。</p>
                            <p>研究重点集中在低维交互控制、零样本动作迁移、仿真到现实迁移三大技术痛点，代表了当前机器人领域最前沿的技术突破方向。</p>
                        </div>
                    </div>

                    <!-- Charts Area -->
                    <div class="flex-1 flex gap-8">
                        <!-- Pie Chart -->
                        <div class="w-[320px] h-[580px] bg-white border border-gray-300 p-6 flex-shrink-0">
                            <div class="size-full flex flex-col">
                                <!-- Title -->
                                <div class="flex-shrink-0 font-semibold mb-4 text-center">
                                    研究方向分布
                                </div>
                                <!-- Chart Content -->
                                <div class="flex-1">
                                    <canvas id="pieChart"></canvas>
                                </div>
                                <!-- Legend -->
                                <div class="flex flex-col gap-2 mt-3">
                                    <div class="flex items-center gap-[6px]">
                                        <div class="w-3 h-3 bg-[#002FA7]"></div>
                                        <span class="font-sans text-[11px] text-gray-900">辅助机器人 (5篇，41.7%)</span>
                                    </div>
                                    <div class="flex items-center gap-[6px]">
                                        <div class="w-3 h-3 bg-black"></div>
                                        <span class="font-sans text-[11px] text-gray-900">人形机器人 (4篇，33.3%)</span>
                                    </div>
                                    <div class="flex items-center gap-[6px]">
                                        <div class="w-3 h-3 bg-[#6B7280]"></div>
                                        <span class="font-sans text-[11px] text-gray-900">工业/自动驾驶机器人 (3篇，25%)</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <script>
        // Pie Chart for research direction distribution
        const ctx = document.getElementById('pieChart').getContext('2d');
        new Chart(ctx, {
            type: 'pie',
            data: {
                labels: ['辅助机器人', '人形机器人', '工业/自动驾驶机器人'],
                datasets: [{
                    data: [5, 4, 3],
                    backgroundColor: ['#002FA7', '#000000', '#6B7280'],
                    borderColor: '#ffffff',
                    borderWidth: 2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                layout: {
                    padding: {
                        top: 20,
                        bottom: 20,
                        left: 20,
                        right: 20
                    }
                },
                plugins: {
                    legend: {
                        display: false
                    },
                    tooltip: {
                        backgroundColor: '#111827',
                        titleFont: {
                            family: 'Inter',
                            size: 12
                        },
                        bodyFont: {
                            family: 'Inter',
                            size: 11
                        },
                        callbacks: {
                            label: function(context) {
                                return context.label + ': ' + context.parsed + '篇 (' + Math.round(context.parsed / 12 * 100) + '%)';
                            }
                        }
                    }
                }
            }
        });
        </script>
    </div>
</body>
</html>
