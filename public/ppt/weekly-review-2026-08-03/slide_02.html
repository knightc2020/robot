<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本周研究概览</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Georgia:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.13/dist/index.global.min.js"></script>
</head>
<body class="min-h-screen flex items-center justify-center">
    <div class="slide-container w-[1280px] h-[720px] overflow-hidden relative aspect-[16/9] flex flex-col bg-white text-gray-600">
        <div class="relative z-10 flex flex-col w-full h-full p-[30px]">
            <header class="flex justify-between items-center pb-2 mb-8 border-b border-black">
                <div class="font-sans text-lg font-semibold text-gray-900 uppercase">OVERVIEW</div>
                <div id="header" class="font-sans text-sm font-semibold text-gray-900">本周研究概览</div>
            </header>
            <main class="flex-1 flex flex-col justify-center">
                <div class="flex gap-12">
                    <div class="w-[428px] flex-shrink-0 pt-6">
                        <h1 class="font-serif text-[40px] font-normal text-gray-900 mb-6 leading-[1.2]">本周研究概览</h1>
                        <div class="font-sans text-[22px] font-normal leading-[1.4]">
                            <p class="mb-4">本周共收录 <strong class="text-[#002FA7]">15篇</strong> 机器人领域最新论文，覆盖触觉世界模型、VLA策略学习、数据效率、人形机器人、双臂操作和自动驾驶六大方向。</p>
                            <p>研究重点集中在触觉感知与世界模型融合、VLA实时化部署、以及数据效率革命三股技术趋势，代表了从实验室原型向消费级硬件与真实场景部署加速演进的前沿方向。</p>
                        </div>
                    </div>
                    <div class="flex-1 flex gap-8">
                        <div class="w-[320px] h-[580px] bg-white border border-gray-300 p-6 flex-shrink-0">
                            <div class="size-full flex flex-col">
                                <div class="flex-shrink-0 font-semibold mb-4 text-center">研究方向分布</div>
                                <div class="flex-1">
                                    <canvas id="pieChart"></canvas>
                                </div>
                                <div class="flex flex-col gap-2 mt-3">
                                    <div class="flex items-center gap-[6px]">
                                        <div class="w-3 h-3 bg-[#002FA7]"></div>
                                        <span class="font-sans text-[11px] text-gray-900">触觉/世界模型 (4篇，26.7%)</span>
                                    </div>
                                    <div class="flex items-center gap-[6px]">
                                        <div class="w-3 h-3 bg-black"></div>
                                        <span class="font-sans text-[11px] text-gray-900">VLA/策略学习 (4篇，26.7%)</span>
                                    </div>
                                    <div class="flex items-center gap-[6px]">
                                        <div class="w-3 h-3 bg-[#2563EB]"></div>
                                        <span class="font-sans text-[11px] text-gray-900">人形机器人 (3篇，20%)</span>
                                    </div>
                                    <div class="flex items-center gap-[6px]">
                                        <div class="w-3 h-3 bg-[#6B7280]"></div>
                                        <span class="font-sans text-[11px] text-gray-900">数据效率 (2篇，13.3%)</span>
                                    </div>
                                    <div class="flex items-center gap-[6px]">
                                        <div class="w-3 h-3 bg-[#475569]"></div>
                                        <span class="font-sans text-[11px] text-gray-900">双臂操作 (1篇，6.7%)</span>
                                    </div>
                                    <div class="flex items-center gap-[6px]">
                                        <div class="w-3 h-3 bg-[#9333EA]"></div>
                                        <span class="font-sans text-[11px] text-gray-900">自动驾驶 (1篇，6.7%)</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
        <script>
        const ctx = document.getElementById('pieChart').getContext('2d');
        new Chart(ctx, {
            type: 'pie',
            data: {
                labels: ['触觉/世界模型', 'VLA/策略学习', '人形机器人', '数据效率', '双臂操作', '自动驾驶'],
                datasets: [{
                    data: [4, 4, 3, 2, 1, 1],
                    backgroundColor: ['#002FA7', '#000000', '#2563EB', '#6B7280', '#475569', '#9333EA'],
                    borderColor: '#ffffff',
                    borderWidth: 2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                layout: { padding: { top: 20, bottom: 20, left: 20, right: 20 } },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: '#111827',
                        titleFont: { family: 'Inter', size: 12 },
                        bodyFont: { family: 'Inter', size: 11 },
                        callbacks: {
                            label: function(context) {
                                return context.label + ': ' + context.parsed + '篇 (' + Math.round(context.parsed / 15 * 100) + '%)';
                            }
                        }
                    }
                }
            }
        });
        </script>
    </div>
</body>
</html>
